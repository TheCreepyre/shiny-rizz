<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashing Light</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 1rem;
        background: #000;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      #light {
        width: min(70vmin, 420px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: #111;
        box-shadow: 0 0 20px #000;
      }

      #light.on {
        background: #fff;
        box-shadow:
          0 0 25px #fff,
          0 0 70px #fff,
          0 0 120px #4da3ff;
      }

      button {
        padding: 0.65rem 1rem;
        border: 1px solid #444;
        border-radius: 0.5rem;
        background: #111;
        color: #fff;
        cursor: pointer;
      }

      p {
        margin: 0;
        color: #bbb;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <p>
      Warning: this page contains flashing lights that may affect people with photosensitive
      epilepsy. Use the button to start or stop the effect.
    </p>
    <div id="light" aria-hidden="true"></div>
    <button id="toggle" type="button" aria-pressed="false">Start flashing</button>
    <div id="status" class="sr-only" aria-live="polite">Flashing is paused.</div>
    <script>
      const FLASH_INTERVAL_MILLISECONDS = 1000;
      const light = document.getElementById("light");
      const button = document.getElementById("toggle");
      const status = document.getElementById("status");

      const toggleLight = () => {
        light.classList.toggle("on");
      };

      let timer = null;

      button.addEventListener("click", () => {
        if (timer !== null) {
          clearInterval(timer);
          timer = null;
          light.classList.remove("on");
          button.textContent = "Start flashing";
          button.setAttribute("aria-pressed", "false");
          status.textContent = "Flashing is paused.";
          return;
        }

        timer = setInterval(toggleLight, FLASH_INTERVAL_MILLISECONDS);
        button.textContent = "Stop flashing";
        button.setAttribute("aria-pressed", "true");
        status.textContent = "Flashing is active.";
      });
    </script>
  </body>
</html>
